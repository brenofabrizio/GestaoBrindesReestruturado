name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestaobrindes
          POSTGRES_USER: gestaobrindes
          POSTGRES_PASSWORD: gestaobrindes
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gestaobrindes -d gestaobrindes"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_DB: gestaobrindes
      POSTGRES_USER: gestaobrindes
      POSTGRES_PASSWORD: gestaobrindes
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production-0123456789-abcdefghijklmn
      DJANGO_DEBUG: 0
      DJANGO_ALLOWED_HOSTS: localhost
      CORS_ALLOWED_ORIGINS: https://frontend.example.test
      CSRF_TRUSTED_ORIGINS: https://api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

